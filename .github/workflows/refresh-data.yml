name: Refresh admissions data

# Runs with no human in the loop. Each run:
#  1. moves the site on to the next application round each July (data/season.json),
#  2. imports any new Education Authority workbooks and profile links,
#  3. tests and builds the site,
#  4. commits to main only if data changed and every check passed.
# Cloudflare Workers Builds (connected to this repository) deploys each push.
# If anything fails, the last good data stays live and an issue is opened;
# the issue closes itself after the next successful run.

on:
  schedule:
    - cron: '23 6 * * 1'      # every Monday, 06:23 UTC
    - cron: '23 6 * 5,6 *'    # daily in May and June, when end-of-Stage-2 figures appear
    - cron: '23 6 1 7 *'      # 1 July, so the season rolls over on time
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    # Set the repository variable IMPORT_RUNNER (e.g. "self-hosted") to run elsewhere
    # if the Education Authority site blocks GitHub's hosted runners.
    runs-on: ${{ vars.IMPORT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Automatic data refresh failed
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Move to the current application round
        run: node scripts/season.mjs

      - name: Import Education Authority data
        run: python scripts/import_data.py

      - name: Test
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          npm test

      - name: Build
        run: npm run build

      - name: Publish changes
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No new data. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh admissions data $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Close the failure issue after a successful run
        if: success()
        run: |
          for n in $(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Fixed: the refresh succeeded in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

      - name: Open or update the failure issue
        if: failure()
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          n=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $run"
          else
            gh issue create --title "$ISSUE_TITLE" --body "The scheduled refresh stopped before publishing, so the site still shows the last good data.

          Run log: $run

          Common causes: the Education Authority changed a workbook's layout or file name, a profile link disappeared, or the site blocked the request. The importer stops on purpose in these cases rather than publish figures it cannot check."
          fi

      - name: Keep the schedule active
        if: always()
        # GitHub pauses schedules in public repositories after 60 days without activity.
        run: gh workflow enable refresh-data.yml || true
